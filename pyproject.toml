[project]
name = "ypf-data-platform"
version = "0.1.0"
description = "Lakehouse del upstream argentino sobre datos publicos reales"
requires-python = ">=3.11,<3.13"
dependencies = [
  "polars>=1.20",
  "pyarrow>=17",
  "duckdb>=1.1",
  "requests>=2.32",
  "openpyxl>=3.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "boto3>=1.43.89",
  "sqlalchemy>=2.0.52",
  "psycopg[binary]>=3.3.5",
  "typer>=0.27.2",
  "pyyaml>=6.0.3",
  "pyiceberg>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "moto[s3]>=5"]

[project.scripts]
ingest = "pipelines.ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.ruff]
line-length = 100
exclude = [".venv", "data", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.3",
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.16.6",
]
