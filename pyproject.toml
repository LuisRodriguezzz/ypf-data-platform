[project]
name = "ypf-data-platform"
version = "0.1.0"
description = "Lakehouse del upstream argentino sobre datos publicos reales"
requires-python = ">=3.11,<3.13"
dependencies = [
  "polars>=1.20",
  "pyarrow>=17",
  "duckdb>=1.1",
  "requests>=2.32",
  "openpyxl>=3.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "boto3>=1.43.89",
  "sqlalchemy>=2.0.52",
  "psycopg[binary]>=3.3.5",
  "typer>=0.27.2",
  "pyyaml>=6.0.3",
  "pyiceberg>=0.10",
  # Cliente de Kafka del productor de replay (ADR 0011). Trae librdkafka compilada, con
  # rueda para Windows (host) y para Linux (runner de Spark, Python 3.10).
  "confluent-kafka>=2.15",
  # Modulo de ML (ADR 0012). Todas pineadas a la ultima version con rueda para Python 3.10,
  # que es el interprete del runner (ADR 0004): el DAG ml_mensual entrena y predice ahi, y un
  # modelo guardado con scikit-learn 1.7.2 tiene que cargarse con 1.7.2. Que el host resuelva
  # a algo mas nuevo que el runner es la unica forma segura de romper la inferencia.
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "shap==0.49.1",
  "matplotlib==3.10.9",
  "mlflow==3.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "moto[s3]>=5"]

[project.scripts]
ingest = "pipelines.ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.ruff]
line-length = 100
exclude = [".venv", "data", "research", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# El runner de Spark trae Python 3.10 (ADR 0004) aunque el repo pida 3.11: los jobs usan
# `timezone.utc`, que en 3.11 seria `datetime.UTC`. La ingesta corre en el mismo runner
# cuando la lanza Airflow (ADR 0006), asi que tambien tiene que ser compatible con 3.10.
"pipelines/spark_jobs/*.py" = ["UP017"]
"pipelines/ingest/manifest.py" = ["UP017"]
# El bronze de reservas corre en el runner (DAG reservas_mensual) y, en aws, en un job de
# Glue Python shell, que trae Python 3.9: `zip(strict=...)` es de 3.10 (B905).
"pipelines/reservas/bronze_load.py" = ["UP017", "B905"]
# El productor de replay y el mapeo de pozos tambien pueden correr en el runner (ADR 0011).
"pipelines/streaming/pozo_map.py" = ["UP017"]
"pipelines/streaming/replay_3w.py" = ["UP017"]
# La inferencia batch corre en el runner desde el DAG ml_mensual (ADR 0012).
"pipelines/ml/predecir.py" = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.3",
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.16.6",
]
