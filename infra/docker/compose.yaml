name: ypf-lakehouse

# Perfiles:
#   core      -> MinIO (S3), Postgres (metadata), catálogo Iceberg REST      [siempre]
#   spark     -> Spark master + workers                                       [etapa 1]
#   airflow   -> orquestador                                                  [etapa 1]
#   streaming -> Kafka + productor de replay 3W                               [etapa 2]
# Uso: podman-compose --profile core up -d

x-minio-env: &minio-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_REGION: us-east-1

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["core"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Crea los buckets del lakehouse una sola vez (idempotente)
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["core"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/landing &&
      mc mb --ignore-existing local/lakehouse &&
      mc version enable local/landing &&
      echo 'buckets listos: landing, lakehouse'
      "
    restart: "no"

  postgres:
    image: postgres:16.15-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lakehouse
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d lakehouse"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Catálogo Iceberg (REST). Registra namespaces y tablas de bronze/silver/gold.
  # Backend JDBC en SQLite sobre volumen (decisión: ADR 0003). La imagen oficial no trae el
  # driver de Postgres y no vale la pena mantener una imagen propia para un entorno local.
  # En AWS el catálogo es Glue Data Catalog, así que este componente no viaja a la nube.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    profiles: ["core"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *minio-env
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:sqlite:file:/data/iceberg_catalog.db
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    volumes:
      - iceberg-catalog:/data
    restart: unless-stopped

volumes:
  minio-data:
  pg-data:
  iceberg-catalog:
