name: ypf-lakehouse

# Perfiles:
#   core      -> MinIO (S3), Postgres (metadata), catálogo Iceberg REST      [siempre]
#   spark     -> runner efímero de Spark (ADR 0004), no es un servicio        [etapa 1]
#   airflow   -> orquestador; lanza el runner por tarea (ADR 0006)            [etapa 1]
#   streaming -> broker de Kafka (KRaft) para la telemetría 3W                 [etapa 2]
#   mlflow    -> tracking server y model registry del módulo de ML (ADR 0012)  [etapa 2]
# Uso: podman-compose --profile core up -d
#      podman-compose --profile core --profile airflow up -d   # UI en http://localhost:8080
#      podman-compose --profile core --profile streaming up -d # o scripts/streaming-up.ps1
#      podman-compose --profile core --profile mlflow up -d    # UI en http://localhost:5000
#      scripts/spark-submit.ps1 pipelines/spark_jobs/bronze_load.py --dataset produccion_pozo

x-minio-env: &minio-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_REGION: us-east-1

# Endpoints y credenciales del lakehouse con los hostnames internos de la red del compose.
# Los usa el runner; Airflow los recibe para reenviárselos a cada runner que lanza (ADR 0006),
# así las credenciales viven solo acá y no se duplican en los DAGs.
x-lakehouse-env: &lakehouse-env
  <<: *minio-env
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  S3_REGION: us-east-1
  S3_LANDING_BUCKET: landing
  ICEBERG_CATALOG_URI: http://iceberg-rest:8181
  ICEBERG_WAREHOUSE: s3://lakehouse/warehouse
  POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakehouse
  # Listener interno del broker: lo usan el job de streaming y el productor cuando corren
  # dentro de la red del compose. Desde el host se usa localhost:29092 (ver config/local.env).
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Tracking server de MLflow visto desde la red del compose. Desde el host es localhost:5000
  # (ver config/local.env). `runner.py` no reenvía esta variable (no está en FORWARDED_ENV),
  # así que el DAG ml_mensual la pone delante del comando; acá sirve al servicio `spark`.
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["core"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Crea los buckets del lakehouse una sola vez (idempotente)
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["core"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/landing &&
      mc mb --ignore-existing local/lakehouse &&
      mc mb --ignore-existing local/mlflow &&
      mc version enable local/landing &&
      echo 'buckets listos: landing, lakehouse, mlflow'
      "
    restart: "no"

  postgres:
    image: postgres:16.15-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lakehouse
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d lakehouse"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Catálogo Iceberg (REST). Registra namespaces y tablas de bronze/silver/gold.
  # Backend JDBC en SQLite sobre volumen (decisión: ADR 0003). La imagen oficial no trae el
  # driver de Postgres y no vale la pena mantener una imagen propia para un entorno local.
  # En AWS el catálogo es Glue Data Catalog, así que este componente no viaja a la nube.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    profiles: ["core"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *minio-env
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      # busy_timeout: con streaming hay dos queries que commitean a la vez y SQLite acepta un
      # solo escritor; sin esto la segunda recibe SQLITE_BUSY y el catálogo devuelve 500, lo
      # que mata la query. Con el timeout la commit espera su turno en vez de fallar.
      # La ruta va sin el prefijo `file:` porque sqlite-jdbc solo interpreta los pragmas de la
      # query string cuando la URL trae el path pelado.
      CATALOG_URI: jdbc:sqlite:/data/iceberg_catalog.db?busy_timeout=30000
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    volumes:
      - iceberg-catalog:/data
    restart: unless-stopped

  # Runner de Spark: contenedor efímero que corre un spark-submit y muere (ADR 0004).
  # No tiene `command`: se lo pasa `podman-compose --profile spark run --rm spark ...`.
  # Requiere el perfil core levantado; no se declara depends_on para que `run` no intente
  # arrancar de nuevo servicios que ya están corriendo.
  spark:
    image: apache/spark:4.0.4-scala2.13-java17-python3-ubuntu
    profiles: ["spark"]
    working_dir: /app
    environment:
      <<: *lakehouse-env
      # La imagen trae HOME=/nonexistent; Ivy necesita un HOME escribible para los jars.
      HOME: /home/spark
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../../pipelines:/app/pipelines:ro
      - ../../config:/app/config:ro
      # Jars y memoria del driver: hay que fijarlos antes de que arranque la JVM.
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      # Cache de jars: Ivy los deja en /home/spark/.ivy2 (spark-defaults.conf) y así no se
      # vuelven a bajar en cada corrida. Se monta el HOME entero por si el runner escribe algo más.
      - ivy-cache:/home/spark

  # Orquestador. No ejecuta código nuestro: cada tarea lanza un runner de Spark por la API de
  # Podman (ADR 0006). `standalone` levanta api-server, scheduler, dag-processor y triggerer en
  # un proceso: alcanza para local y evita cuatro servicios más.
  # Se levanta junto con core: `podman-compose --profile core --profile airflow up -d`, porque
  # podman-compose resuelve el depends_on solo si el perfil del servicio del que depende está.
  airflow:
    image: apache/airflow:3.3.1-python3.12
    profiles: ["airflow"]
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Mismas credenciales y endpoints que el runner: se los pasa a cada contenedor que lanza.
      <<: *lakehouse-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Sin login en local: la UI entra directo como admin. Nunca fuera de la máquina de dev.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW__API__BASE_URL: http://localhost:8080
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Argentina/Buenos_Aires
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Argentina/Buenos_Aires
      # Coordenadas del runner que los DAGs necesitan para lanzarlo (ver orchestration/dags/runner.py).
      RUNNER_IMAGE: apache/spark:4.0.4-scala2.13-java17-python3-ubuntu
      RUNNER_NETWORK: ypf-lakehouse_default
      RUNNER_IVY_VOLUME: ypf-lakehouse_ivy-cache
      # Ruta del repo vista desde la máquina de Podman: los montajes del runner los resuelve
      # el motor, no el contenedor de Airflow. Se define en infra/docker/.env.
      RUNNER_REPO_DIR: ${RUNNER_REPO_DIR}
    ports:
      - "8080:8080"
    volumes:
      - ../../orchestration/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      # API de Podman: es lo que abre el DockerOperator para lanzar el runner.
      - podman-socket:/var/run/podman
    restart: unless-stopped

  # Tracking server y model registry de MLflow (ADR 0012). Backend en Postgres —el registry de
  # modelos y los alias no funcionan contra un backend de archivos— y artefactos en el bucket
  # `mlflow` de MinIO.
  #
  # Los artefactos van a `s3://mlflow/` y cada cliente habla con MinIO por su cuenta: el host
  # por `localhost:9000` y el runner por `minio:9000`, que es lo que ya sabe `LakehouseConfig`.
  # Se probó `--serve-artifacts` para que el server hiciera de proxy y no anda en este entorno:
  # la subida pasa por el server, pero la bajada devuelve una URL prefirmada apuntando al
  # endpoint del server (`minio:9000`), que desde Windows no resuelve.
  #
  # El `pip install` del arranque es porque la imagen oficial no trae ni el driver de Postgres
  # ni boto3: son 2 paquetes y se instalan al crear el contenedor, no en cada `up`. Mantener
  # una imagen propia para eso sería más infraestructura de la que el proyecto necesita.
  #
  # `--allowed-hosts` porque MLflow 3 valida el header Host contra una lista blanca que por
  # defecto es solo localhost: sin `mlflow:5000` el runner recibe 403 "Invalid Host header".
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    profiles: ["mlflow"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *minio-env
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command:
      - /bin/sh
      - -c
      - >
        pip install --quiet --no-cache-dir --root-user-action=ignore
        psycopg2-binary==2.9.11 boto3==1.43.89 &&
        mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
        --default-artifact-root s3://mlflow/
        --allowed-hosts localhost:5000,127.0.0.1:5000,mlflow:5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  # Broker de Kafka en modo KRaft (ADR 0011): un solo nodo que es broker y controller a la
  # vez, sin Zookeeper (Kafka 4 ya no lo usa). Dos listeners porque hay dos clientes posibles:
  # `kafka:9092` desde la red del compose (runner de Spark) y `localhost:29092` desde el host
  # (el productor de replay). Un cliente solo puede conectarse por el listener cuyo
  # advertised host resuelve desde donde corre.
  kafka:
    image: apache/kafka:4.1.2
    profiles: ["streaming"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Con un solo broker todo lo que por defecto pide tres réplicas tiene que bajar a una.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 512 MB de heap alcanzan para 13 particiones en local y le dejan la RAM a Spark.
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports:
      - "29092:29092"
    # Sin volumen a propósito: el log del topic vive en la capa escribible del contenedor.
    # La demo se apaga al terminar y el topic se vuelve a crear en el próximo `up`; un volumen
    # nuevo lo crea Podman como root y el proceso de Kafka (uid 1000) no podría escribirlo.
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  # Crea el topic una sola vez (idempotente), igual que minio-init con los buckets.
  # 13 particiones = los 13 equipos concurrentes que reporta el RTIC; la clave del mensaje es
  # el idpozo, así todas las lecturas de un pozo caen siempre en la misma partición y llegan
  # ordenadas al consumidor.
  kafka-init:
    image: apache/kafka:4.1.2
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
      --topic telemetria_pozo --partitions 13 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic telemetria_pozo
      "
    restart: "no"

volumes:
  minio-data:
  pg-data:
  iceberg-catalog:
  ivy-cache:
  airflow-logs:

  # Carpeta del socket de la API de Podman dentro de la máquina WSL (el uid del usuario de
  # `podman machine` es siempre 1000). Va como volumen con `device` y no como bind mount porque
  # el cliente de Podman para Windows traduce las rutas absolutas de los bind mounts a rutas de
  # Windows: `/run/user/1000/...` termina montando `C:\run\user\1000\...`, que no existe.
  # Se monta la carpeta y no el socket: `mount --bind` de un socket sobre un directorio falla.
  podman-socket:
    driver: local
    driver_opts:
      type: none
      device: /run/user/1000/podman
      o: bind
