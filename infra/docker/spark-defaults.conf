# Configuración que Spark necesita ANTES de arrancar la JVM, por lo que no puede vivir en el
# código del job: cuando `build_spark` crea la SparkSession la JVM ya está levantada y un
# `spark.jars.packages` puesto ahí se ignora (falla con ClassNotFoundException de Iceberg).
#
# Versiones (ver ADR 0004):
#   iceberg 1.10.1 -> igual que la imagen apache/iceberg-rest-fixture:1.10.1 del catálogo
#   hadoop-aws 3.4.1 -> igual que el hadoop-client que trae apache/spark:4.0.4
#   scala 2.13 y spark 4.0 -> los de la imagen del runner
#
# iceberg-spark-runtime: catálogo Iceberg.  iceberg-aws-bundle: S3FileIO para las tablas.
# hadoop-aws: driver s3a con el que se leen los CSV crudos de landing.
# postgresql: JDBC para leer el manifiesto de ingesta sin dependencias Python extra.
spark.jars.packages  org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.10.1,org.apache.iceberg:iceberg-aws-bundle:1.10.1,org.apache.hadoop:hadoop-aws:3.4.1,org.postgresql:postgresql:42.7.7

# Los jars bajados quedan en el volumen `ivy-cache` montado en el HOME del runner.
spark.jars.ivy       /home/spark/.ivy2

spark.driver.memory  4g
