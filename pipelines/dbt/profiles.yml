# Perfil de dbt versionado con el repo: no tiene secretos porque el destino local no los
# necesita (la sesión de Spark ya viene armada por run_dbt.py con las credenciales del
# entorno) y el destino aws usa el rol de la cuenta.

ypf_gold:
  target: local

  outputs:
    # Destino local (ADR 0009): dbt corre dentro del runner de Spark y reusa la SparkSession
    # que arma pipelines/spark_jobs/session.py. `host` es obligatorio en el esquema del perfil
    # pero el método `session` no lo usa: no hay ningún socket que abrir.
    local:
      type: spark
      method: session
      host: localhost
      schema: gold
      threads: 1 # un solo driver de Spark de 4 GB: los modelos van de a uno

    # Destino aws (ADR 0008): esbozado, todavía sin implementar. Athena lee las mismas tablas
    # Iceberg desde el Glue Data Catalog, así que los modelos no cambian; lo que falta es el
    # workgroup, el bucket de resultados y reemplazar md5() por lower(to_hex(md5(to_utf8(x))))
    # en macros/claves.sql, que es la única función que Athena escribe distinto.
    # aws:
    #   type: athena
    #   s3_staging_dir: s3://<bucket>/athena-results/
    #   region_name: us-east-1
    #   database: awsdatacatalog
    #   schema: gold
    #   work_group: primary
    #   threads: 4
