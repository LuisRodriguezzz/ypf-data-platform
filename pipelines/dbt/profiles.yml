# Perfil de dbt versionado con el repo: no tiene secretos porque el destino local no los
# necesita (la sesión de Spark ya viene armada por run_dbt.py con las credenciales del
# entorno) y el destino aws usa el rol del job de Glue.

ypf_gold:
  target: local

  outputs:
    # Destino local (ADR 0009): dbt corre dentro del runner de Spark y reusa la SparkSession
    # que arma pipelines/spark_jobs/session.py. `host` es obligatorio en el esquema del perfil
    # pero el método `session` no lo usa: no hay ningún socket que abrir.
    local:
      type: spark
      method: session
      host: localhost
      schema: gold
      threads: 1 # un solo driver de Spark de 4 GB: los modelos van de a uno

    # Destino aws (ADR 0010): dbt-athena manda SQL a Athena, que lee y escribe las mismas
    # tablas Iceberg del Glue Data Catalog. Todo lo que depende de la cuenta llega por
    # entorno, que es lo que exporta pipelines/aws/gold_dbt_job.py desde los argumentos del
    # job; nada de esto es secreto, pero tampoco tiene por qué estar escrito en el repo.
    aws:
      type: athena
      region_name: "{{ env_var('AWS_REGION') }}"
      work_group: "{{ env_var('ATHENA_WORKGROUP') }}"
      database: "{{ env_var('ATHENA_DATABASE') }}"
      # La base de Glue lleva el sufijo del ambiente (`gold_dev`, `gold_prod`) porque dev y
      # prod comparten cuenta y el catálogo no admite dos bases `gold` (ADR 0014). El valor
      # lo pone Terraform como argumento del job y lo exporta `gold_dbt_job.py`; el default
      # vacío es para el destino local, donde no hay ambientes.
      schema: "gold{{ env_var('GLUE_DATABASE_SUFFIX', '') }}"
      # Resultados de las consultas (descartables) y datos de las tablas (no). Van a prefijos
      # distintos a propósito: athena-results/ se vacía a los 7 días por regla de ciclo de
      # vida del bucket y ahí adentro gold duraría una semana.
      s3_staging_dir: "{{ env_var('S3_STAGING_DIR') }}"
      s3_data_dir: "{{ env_var('S3_DATA_DIR') }}"
      threads: 4 # Athena es el que ejecuta: acá no hay JVM que se pelee la RAM
