name: gold
version: 1.0.0
config-version: 2
profile: ypf_gold

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  gold:
    # Todo gold son tablas Iceberg, igual que bronze y silver. Cada adaptador nombra la
    # misma decisión a su manera y se ignoran las claves del otro: `file_format` es de
    # dbt-spark (destino local) y `table_type` + `format` de dbt-athena (destino aws).
    +file_format: iceberg
    +table_type: iceberg
    +format: parquet
    dimensiones:
      +materialized: table
    hechos:
      +materialized: table
    marts:
      +materialized: table
    monitoreo:
      +materialized: table
      # Solo en el destino local. Los modelos de monitoreo miran tablas que en aws no existen
      # —la agregación de streaming y la salida del modelo de ML viven solo acá— y leen la
      # metadata de snapshots de Iceberg, que Spark y Athena exponen con sintaxis distinta.
      # El entorno de aws además es efímero (se crea, se demuestra y se destruye): lo que hay
      # que vigilar ahí son las ejecuciones de Step Functions, no la antigüedad de una tabla.
      +enabled: "{{ target.name == 'local' }}"
