name: gold
version: 1.0.0
config-version: 2
profile: ypf_gold

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  gold:
    # Todo gold son tablas Iceberg, igual que bronze y silver. Cada adaptador nombra la
    # misma decisión a su manera y se ignoran las claves del otro: `file_format` es de
    # dbt-spark (destino local) y `table_type` + `format` de dbt-athena (destino aws).
    +file_format: iceberg
    +table_type: iceberg
    +format: parquet
    dimensiones:
      +materialized: table
    hechos:
      +materialized: table
    marts:
      +materialized: table
